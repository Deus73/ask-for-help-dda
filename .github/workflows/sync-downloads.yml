name: Downloads actueel houden
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-downloads
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controleer stabiele Android- en Tizen-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync-downloads.py
      - name: Werk de versietabel bij
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md versions.json
          if ! git diff --cached --quiet; then git commit -m 'Werk OS-downloads bij'; git push; fi
